limit_req_zone $binary_remote_addr zone=vpn_probe:1m rate=1r/m;
server {
    listen 5800 ssl;
    server_name vpn.example.com example.com;
    ssl_certificate /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;
    auth_basic off;
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    access_log off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ^~ /d/ {
        error_log /dev/null;
        proxy_pass http://unix:/usr/share/nginx/html/.vpn-dashboard/usage.sock:;
        proxy_set_header Authorization "";
        proxy_set_header Host localhost;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        client_max_body_size 1k;
    }
    location ^~ /s/ {
        error_log /dev/null;
        proxy_pass http://unix:/usr/share/nginx/html/.vpn-dashboard/usage.sock:;
        proxy_set_header Authorization "";
        proxy_set_header Host localhost;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        client_max_body_size 1k;
    }
    location = /probe/report {
        error_log /dev/null;
        limit_req zone=vpn_probe burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/usr/share/nginx/html/.vpn-dashboard/usage.sock:;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host localhost;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        client_max_body_size 1k;
    }
    location = /config.yaml {
        auth_basic "VPN Subscription";
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Profile-Web-Page-Url "https://example.com/vpn/" always;
        limit_except GET { deny all; }
    }
    location ^~ /downloads/ {
        auth_basic "VPN Download";
        root /usr/share/nginx/html;
        limit_except GET { deny all; }
    }
    location ^~ /api/ { return 410; }
    location ~ /\. { return 404; }
    location / { return 302 https://example.com/vpn/; }
}
