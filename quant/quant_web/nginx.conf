server {
    listen 80;
    server_name example.com www.example.com;
    if ($host !~* ^(yeshiwuyu\.xyz|www\.yeshiwuyu\.xyz)$) { return 444; }

    root /app/quant_web;

    # Let's Encrypt 验证（放 80 端口上）
    location /.well-known/acme-challenge/ {
        root /app/quant_web/static;
    }

    location /vpn/sub/ { access_log off; error_log /dev/null; return 301 https://example.com$request_uri; }

    # 其他 HTTP 请求全部重定向到 HTTPS
    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;
    if ($host !~* ^(yeshiwuyu\.xyz|www\.yeshiwuyu\.xyz)$) { return 444; }
    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /app/quant_web;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    location = /test.html { return 404; }

    # Only presentation assets are public. Data files pass through Flask authorization.
    location ~* ^/static/.*\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Public routing policy only: no node credentials or account data.
    location = /vpn/rules/unified.conf {
        alias /app/quant_web/static/vpn-rules/unified.conf;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Only this resource whitelist bypasses website sessions; never log tokens.
    location ~ "^/vpn/sub/([A-Za-z0-9_-]{43})/(config\.yaml|shadowrocket\.txt|node\.txt)$" {
        access_log off;
        error_log /dev/null;
        set $vpn_subscription_token $1;
        set $vpn_subscription_kind $2;
        rewrite ^ /vpn/subscription-download/$vpn_subscription_kind break;
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-VPN-Subscription-Token $vpn_subscription_token;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_buffering off;
    }
    location /vpn/sub/ { access_log off; error_log /dev/null; return 404; }
    location ^~ /vpn/subscription-download/ { access_log off; return 404; }

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
